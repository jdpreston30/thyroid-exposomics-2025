# Analysis Configuration - Dynamic Computer Detection
# Project settings and data paths for reproducible analysis

# Computer-specific path templates
computers:
  laptop:
    user_home: "/Users/jdp2019"
    onedrive_path: "Library/CloudStorage/OneDrive-Emory"
    figures_path: "Outputs/Figures/Final"
  
  desktop:
    user_home: "/Users/JoshsMacbook2015" 
    onedrive_path: "Library/CloudStorage/OneDrive-Emory"
    figures_path: "Outputs/Figures/Final"

# Dynamic path templates (will be populated based on computer selection)
paths:
  # Raw data path templates - {user_home} and {onedrive_path} will be substituted
  base_data_path: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022"
  # Specific file paths (built from base)
  primary_data: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/primary_data.xlsx"
  #! Staging for rtx() grobs (written, transferred to validation_plot_directory_onedrive, then deleted). Moved OUT of the repo on 2026-09-10: the repo lives in ~/Desktop, which the iCloud Drive file provider syncs, and churning gigabytes of temp RDS through it is what wedged fileproviderd on 09-07 and what let iCloud swap the compile PDF's inode mid-write (punch list 133). Any path outside the synced tree is fine; the run creates it.
  validation_plot_directory: "{user_home}/Library/Caches/thyroid-exposomics/temp_RDS"
  #! rtx() DELETES the local temp copies after transferring (rtx.R:1116-1134), so this is the only persistent grob store and script 09's vp() fallback reads from it.
  #! During a full rebuild (2026-09-07 to 09-10) this pointed at the external drive so ~11 GB of grob writes never touched OneDrive, whose fileproviderd wedged twice; the drive copy was then rsynced here WITHOUT --delete (OneDrive holds 680 diagnostic files the drive does not).
  validation_plot_directory_onedrive: "{base_data_path}/validation_plots"  # OneDrive final location

  # Raw MS data directories for spectral validation
  #! Both keys are READ-ONLY mzML paths, consumed solely by convert_raw_to_mzml() (which appends "mzML_validation") and rtx.R:73-80. Nothing writes here.
  # GC1 in the tumor folder name is a mislabel; both batches ran on GC2 -- see convert_raw_to_mzml.R
  #! For a rebuild, point both at a local mirror of the mzML files (191 files, ~21 GB): reading them off OneDrive placeholders killed the 2026-09-03 run. The 2026-09 rebuilds used ~/mzml_local, an APFS folder of symlinks into the external drive (exFAT cannot hold symlinks). convert_raw_to_mzml() only needs mzML_validation to exist.
  tumor_raw_dir: "{base_data_path}/Tumors/GC080_GC1_M524_Thyroid_Tissue_12082022"
  # Trailing /ThyroidTissue_08222024 removed 2026-09-03: that folder does not exist. raw/, mzxml/ and
  # mzML_validation/ (45 files each) sit directly under GC097_GC2_Thyroid_Tissue_08222024, and
  # convert_raw_to_mzml() appends "mzML_validation" itself, so the extra segment broke every cadaver path.
  cadaver_raw_dir: "{base_data_path}/Cadaver/GC097_GC2_Thyroid_Tissue_08222024"
  cadaver_metadata: "{base_data_path}/Cadaver/donor_info/cadaver_metadata.xlsx"
  
  # PeakWalk data directories
  peakwalk_tumor_dir: "{base_data_path}/PeakWalk_12_5_24/Tumors"
  peakwalk_cadaver_dir: "{base_data_path}/PeakWalk_12_5_24/Cadaver"

  # Metadata files (now in OneDrive)
  chemical_metadata: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/chemical_metadata.xlsx"
  brand_names: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/brand_names.xlsx"
  gc2_features: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/GC2_features.csv"
  gc2_expanded: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/expanded_GC2.csv"
  validation: "{user_home}/{onedrive_path}/Research/MS_raw_data/GCMS/Thyroid_GCMS/DTC_2022/metadata_files/validation.xlsx"
  tumor_pathology: "{user_home}/{onedrive_path}/Research/MS_raw_data/LCMS/Thyroid_LCMS/Clinical/tumor_pathology.xlsx"
  
  # Output paths (relative to project root)
  output: "./Outputs"
  figures: "{figures_path}"
  
  # Script and utility paths
  scripts: "R/Scripts/"
  utils: "R/Utilities/"

# Analysis settings (same across all computers)
analysis:
  # Project metadata
  project_name: "thyroid-exposomics-2025"
  description: "Thyroid Exposomics Analysis"
  
  # Script execution flags
  run_validation_step: false  # Set to true to run full validation workflow (scripts 08-09)
  #! Set to true ONLY for a grob rebuild, then back to false -- otherwise every r() re-runs 08-09 and rewrites all 59 grobs, discarding manual review state.
  #! All four blocks run in ONE process since 2026-09-10 (the final pre-submission rebuild took 1 h 40 min end to end). Earlier rebuilds died on whichever block ran last because rtx() returned every ggplot object through the PSOCK sockets (punch list 134); workers now return RDS names and the PDF compiler reads grobs back from disk in forked children.
  rebuild_iarc_grobs: true  # Sections 8.2.1/8.2.2
  rebuild_variant_grobs_pt1: true  # Section 8.2.3 (rows 1-20); split from pt12 on 2026-09-08
  rebuild_variant_grobs_pt2: true  # Section 8.2.4 (rows 21-40); split from pt12 on 2026-09-08
  rebuild_variant_grobs_pt3: true  # Section 8.2.5 (rows 41+); gated 2026-09-07, previously always ran
  #! Only set these false when validation_plots/iarc_tumor_rtx, iarc_cadaver_rtx and variant_rtx hold CURRENT grobs -- vp() loads stale ones silently, with the old chemical names.
  #! Worker count for every rtx() call in script 08 (PSOCK workers, ~1 GB each). 7 on this 8-core/16 GB M1: every block finished in under 4 minutes on 2026-09-10 once the collect no longer shipped grobs back (punch list 134). The earlier OOM kills at 7, 5 and 4 workers were that collect, not the worker count.
  rtx_n_cores: 7
  run_iarc_fragment_check: false  # Section 8.3 only; diagnostic PDFs, feeds nothing in the supplement
  #! 8.3 is nine SERIAL single-compound runs (use_parallel = FALSE, iterate_through = 120) costing hours. Its output is not consumed by script 09 or by the figure_order sheet. Leave false unless you specifically want to eyeball IARC fragment PDFs.
  
  # Environment preferences
  tibble_options:
    print_max: 100
    print_min: 100
    sigfig: 7
    
  # Data.table preferences  
  datatable_options:
    print_class: true
    print_keys: true
    aware: true
